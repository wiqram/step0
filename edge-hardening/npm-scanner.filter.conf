# Managed by STEP0/edge-hardening.sh (installed to /etc/fail2ban/filter.d/npm-scanner.conf).
# Secret/exploit-path probes against NPM-fronted hosts.
# Matches the URI, not the status: the SPAs answer 200 for unknown paths. Dotfile patterns carry a leading
# '/' so a legit asset like /_next/static/chunks/dev.env.js can never match (caught by the false-positive
# test in tests/test-edge-hardening.sh).
[Definition]
_paths = (?:/\.env|/\.git(?:/|config|ignore)|/\.aws/|/\.ssh/|/\.svn/|/\.hg/|/\.DS_Store|/\.htpasswd|phpinfo|wp-login|wp-admin|wp-includes|xmlrpc\.php|phpmyadmin|vendor/phpunit|cgi-bin/|actuator/(?:env|heapdump|gateway)|SDK/webLanguage|id_rsa|/etc/passwd)
# Line 1 = NPM per-host format:  [time] cache upstream status - METHOD scheme host "uri" [Client ip] ...
# Line 2 = default-host_access.log, nginx `combined`:  ip - - [time] "METHOD uri HTTP/x" ...
# fail2ban STRIPS the matched timestamp before applying these, leaving a literal "[]" at the start of the
# line (verified with fail2ban-regex -vv; an earlier ^\[time\]-anchored version matched 0 of 75k lines),
# so neither regex depends on the exact shape of what is left of the date.
failregex = ^.* [A-Z]+ https?\s\S+ "\S*?%(_paths)s\S*" \[Client <HOST>\]
            ^<HOST> - \S+ .*?"[A-Z]+ \S*?%(_paths)s\S* HTTP
ignoreregex =
