# Self-managed copy of the minikube `registry-proxy` DaemonSet (verbatim from the addon, minus the
# Reconcile/minikube-addons labels). This is what exposes the registry on the NODE at hostPort 5000,
# so `172.16.238.2:5000` (and the NPM-fronted container-registry.traderyolo.com) keep working.
# It forwards node:5000 → Service registry.kube-system.svc.cluster.local:80 → registry pod:5000.
# MUST be applied together with 20-registry.yaml; without it nothing can push/pull on :5000.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: registry-proxy
  namespace: kube-system
  labels:
    app: registry
spec:
  selector:
    matchLabels:
      registry-proxy: "true"
  template:
    metadata:
      labels:
        registry-proxy: "true"
    spec:
      containers:
        - name: registry-proxy
          image: registry.k8s.io/minikube/kube-registry-proxy:v0.0.11@sha256:e321acf067df0a78fba3ff97748c10029ca2c413c5b7207e4ca000c62fcdac93
          imagePullPolicy: IfNotPresent
          ports:
            - name: registry
              containerPort: 80
              hostPort: 5000
          env:
            - name: REGISTRY_HOST
              value: registry.kube-system.svc.cluster.local
            - name: REGISTRY_PORT
              value: "80"
