# Installed to /etc/logrotate.d/step0 by restore-scratch.sh (host-config phase), run by the
# host's own daily logrotate. THIS repo copy is the source of truth — until 2026-11-13 the
# file existed ONLY in /etc on this box, so a bare-metal rebuild would have silently lost
# rotation for every STEP0 log (the same failure that left NPM's per-host logs unrotated
# since 2021; see npm-host-logs.conf). Edit here, then: sudo install -m 0644 logrotate/step0.conf /etc/logrotate.d/step0
#
# STEP0 automation logs. These are appended by cron every 5-10 minutes
# (vault-auto-unseal, cluster-autostart, alerting-pipeline-watch) plus the
# 6-hourly cache prune and the weekly registry prune. Nothing rotated them, so
# they grew forever on /home — slowly, but with no ceiling at all.
# copytruncate: the writers are long-lived shell redirects (>>) that hold the fd
# open, so renaming the file would leave them writing to an unlinked inode and
# the "new" log would stay empty. Truncating in place is what actually works here.
/home/cloud/Ideaprojects/STEP0/logs/*.log {
    weekly
    rotate 8
    maxsize 50M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su cloud cloud
}
