# logrotate/npm-host-logs.conf — rotate nginx-proxy-manager's per-host logs that NPM's
# OWN logrotate rule cannot see. Run by the cloud crontab (cron/cloud-crontab), as cloud.
#
# WHY THIS EXISTS (found 2026-11-13)
#   NPM rotates /data/logs/*_access.log and *_error.log (its /etc/logrotate.d rule, run by
#   the container's cron.daily) — and that works: fallback_*.log rotate weekly. But every
#   proxy-host conf on this box was generated by an OLDER NPM that named the log
#   `proxy_host-<id>.log` (and `redirection_host-<id>.log`). NPM regenerates a conf only
#   when that host is re-saved, so after the upgrade to 2.15.1 all 40 per-host logs kept the
#   old name, matched nothing, and had grown untouched since creation: 9.1 GB, with
#   proxy_host-1.log at 4.4 GB and predictonomy's at 905 MB. They also ride along in every
#   weekly DR archive (backup-minikube-mnt.sh tars the whole nginx dir).
#
#   Covering the legacy names HERE, rather than re-saving every host in NPM or adding a
#   file inside the container, changes nothing about the edge itself: no conf is
#   regenerated, the container is not recreated, and nothing is lost if it ever is. If a
#   host IS re-saved later, its log moves to NPM's own naming and NPM's own rule takes
#   over — the two never match the same file.
#
# POLICY — the same NPM applies to its own access logs: weekly, keep 4, gzip.
#   Rotated files keep NPM's numeric scheme (proxy_host-30.log.1.gz ...), so anything that
#   greps "the current log" keeps working (e.g. SEC-BRUTE-FORCE-EDGE's 429s in
#   proxy_host-7.log).
#
# MECHANICS
#   * `su cloud cloud`: /data/logs is mode 0777 (NPM's choice), and logrotate refuses a
#     world-writable parent directory unless `su` is set. Running as cloud also means no
#     root is needed: the 0777 dir lets cloud rename/unlink, and the logs are world-readable
#     for gzip.
#   * nginx keeps writing to the RENAMED file until told otherwise. postrotate asks the
#     running nginx to reopen its logs (`nginx -s reopen` = the USR1 NPM's own rule sends);
#     nginx — root inside the container — recreates each file under the same name.
#     Order is rename -> postrotate -> compress, so compression only ever touches a file
#     nginx has already let go of.
#   * State lives in STEP0/logs/ (not /var/lib/logrotate, which is root's).
#   * First run on a fresh state file records dates and rotates NOTHING (weekly is
#     measured from the recorded date). To rotate immediately, run once with -f:
#       logrotate -f -s ~/Ideaprojects/STEP0/logs/.npm-host-logs.logrotate-state \
#         ~/Ideaprojects/STEP0/logrotate/npm-host-logs.conf

/home/cloud/Ideaprojects/nginx/data/logs/proxy_host-*.log
/home/cloud/Ideaprojects/nginx/data/logs/redirection_host-*.log
/home/cloud/Ideaprojects/nginx/data/logs/dead_host-*.log
{
    su cloud cloud
    weekly
    rotate 4
    missingok
    notifempty
    compress
    nocreate
    sharedscripts
    postrotate
        docker exec nginx-proxy-manager nginx -s reopen >/dev/null 2>&1 || true
    endscript
}
